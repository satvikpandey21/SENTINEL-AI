[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-security"
version = "0.1.0"
description = "Reusable infrastructure and ASGI observability for SENTINEL AI"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "pydantic-settings>=2.7,<3", "SQLAlchemy[asyncio]>=2.0.36,<3",
  "asyncpg>=0.30,<1", "redis>=5.2,<8", "aio-pika>=9.5,<10", "structlog>=25,<26",
  "argon2-cffi>=25.1,<26", "PyJWT>=2.10,<3", "prometheus-client>=0.23,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sentinel_security = ["*.lua"]
