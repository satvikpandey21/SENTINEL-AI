[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = ["integration: requires real PostgreSQL, Redis and RabbitMQ"]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["apps/admin-api/src", "apps/demo-api/src", "apps/event-worker/src", "packages/sentinel-security/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"scripts/**" = ["S603"]
