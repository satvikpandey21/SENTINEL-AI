# Explicit opt-in for host-based development; every binding is loopback-only.
services:
  postgres:
    networks: [backend, ingress]
    ports: ['127.0.0.1:5432:5432']
  redis:
    networks: [backend, ingress]
    ports: ['127.0.0.1:6379:6379']
  rabbitmq:
    networks: [backend, ingress]
    ports: ['127.0.0.1:5672:5672', '127.0.0.1:15672:15672']
  demo-api:
    networks: [backend, ingress]
    ports: ['127.0.0.1:8001:8000']
