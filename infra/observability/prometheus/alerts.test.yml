{
  "rule_files": [
    "alerts.yml"
  ],
  "evaluation_interval": "1m",
  "tests": [
    {
      "name": "SentinelAdminUnavailable pending, firing, recovered",
      "interval": "1m",
      "input_series": [
        {
          "series": "up{job=\"sentinel-apps\",component=\"admin-api\"}",
          "values": "0+0x16 1+0x20"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "0m",
          "alertname": "SentinelAdminUnavailable",
          "exp_alerts": []
        },
        {
          "eval_time": "16m",
          "alertname": "SentinelAdminUnavailable",
          "exp_alerts": [
            {
              "exp_labels": {
                "job": "sentinel-apps",
                "component": "admin-api",
                "severity": "critical",
                "scope": "operational"
              },
              "exp_annotations": {
                "summary": "SentinelAdminUnavailable",
                "description": "Administrative metrics listener unavailable; inspect service readiness."
              }
            }
          ]
        },
        {
          "eval_time": "30m",
          "alertname": "SentinelAdminUnavailable",
          "exp_alerts": []
        }
      ]
    },
    {
      "name": "SentinelWorkerUnavailable pending, firing, recovered",
      "interval": "1m",
      "input_series": [
        {
          "series": "sentinel_worker_connected{service=\"sentinel-event-worker\"}",
          "values": "0+0x16 1+0x20"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "0m",
          "alertname": "SentinelWorkerUnavailable",
          "exp_alerts": []
        },
        {
          "eval_time": "16m",
          "alertname": "SentinelWorkerUnavailable",
          "exp_alerts": [
            {
              "exp_labels": {
                "service": "sentinel-event-worker",
                "severity": "critical",
                "scope": "operational"
              },
              "exp_annotations": {
                "summary": "SentinelWorkerUnavailable",
                "description": "Event worker is unavailable or disconnected from RabbitMQ."
              }
            }
          ]
        },
        {
          "eval_time": "30m",
          "alertname": "SentinelWorkerUnavailable",
          "exp_alerts": []
        }
      ]
    },
    {
      "name": "SentinelDependencyUnavailable pending, firing, recovered",
      "interval": "1m",
      "input_series": [
        {
          "series": "sentinel_dependency_up{service=\"sentinel-demo-api\",dependency=\"redis\"}",
          "values": "0+0x16 1+0x20"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "0m",
          "alertname": "SentinelDependencyUnavailable",
          "exp_alerts": []
        },
        {
          "eval_time": "16m",
          "alertname": "SentinelDependencyUnavailable",
          "exp_alerts": [
            {
              "exp_labels": {
                "service": "sentinel-demo-api",
                "dependency": "redis",
                "severity": "warning",
                "scope": "operational"
              },
              "exp_annotations": {
                "summary": "SentinelDependencyUnavailable",
                "description": "A completed application dependency probe reports unavailable."
              }
            }
          ]
        },
        {
          "eval_time": "30m",
          "alertname": "SentinelDependencyUnavailable",
          "exp_alerts": []
        }
      ]
    },
    {
      "name": "SentinelEventBacklog pending, firing, recovered",
      "interval": "1m",
      "input_series": [
        {
          "series": "rabbitmq_detailed_queue_messages_ready{queue=\"sentinel.security.events.v1\"}",
          "values": "1001+0x16 0+0x20"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "0m",
          "alertname": "SentinelEventBacklog",
          "exp_alerts": []
        },
        {
          "eval_time": "16m",
          "alertname": "SentinelEventBacklog",
          "exp_alerts": [
            {
              "exp_labels": {
                "queue": "sentinel.security.events.v1",
                "severity": "warning",
                "scope": "operational"
              },
              "exp_annotations": {
                "summary": "SentinelEventBacklog",
                "description": "More than 1000 events have remained ready for five minutes."
              }
            }
          ]
        },
        {
          "eval_time": "30m",
          "alertname": "SentinelEventBacklog",
          "exp_alerts": []
        }
      ]
    },
    {
      "name": "SentinelWorkerFailures pending, firing, recovered",
      "interval": "1m",
      "input_series": [
        {
          "series": "sentinel_worker_deliveries_total{outcome=\"error\"}",
          "values": "0+20x16 320+0x20"
        },
        {
          "series": "sentinel_worker_deliveries_total{outcome=\"persisted\"}",
          "values": "0+180x16 2880+0x20"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "0m",
          "alertname": "SentinelWorkerFailures",
          "exp_alerts": []
        },
        {
          "eval_time": "16m",
          "alertname": "SentinelWorkerFailures",
          "exp_alerts": [
            {
              "exp_labels": {
                "severity": "warning",
                "scope": "operational"
              },
              "exp_annotations": {
                "summary": "SentinelWorkerFailures",
                "description": "Over 5% processing failures/quarantines with at least 20 deliveries in five minutes."
              }
            }
          ]
        },
        {
          "eval_time": "30m",
          "alertname": "SentinelWorkerFailures",
          "exp_alerts": []
        }
      ]
    },
    {
      "name": "SentinelApiErrors pending, firing, recovered",
      "interval": "1m",
      "input_series": [
        {
          "series": "sentinel_http_requests_total{service=\"sentinel-demo-api\",status_class=\"5xx\"}",
          "values": "0+20x16 320+0x20"
        },
        {
          "series": "sentinel_http_requests_total{service=\"sentinel-demo-api\",status_class=\"2xx\"}",
          "values": "0+180x16 2880+0x20"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "0m",
          "alertname": "SentinelApiErrors",
          "exp_alerts": []
        },
        {
          "eval_time": "16m",
          "alertname": "SentinelApiErrors",
          "exp_alerts": [
            {
              "exp_labels": {
                "service": "sentinel-demo-api",
                "severity": "warning",
                "scope": "operational"
              },
              "exp_annotations": {
                "summary": "SentinelApiErrors",
                "description": "Over 5% HTTP 5xx responses with at least 100 requests in five minutes."
              }
            }
          ]
        },
        {
          "eval_time": "30m",
          "alertname": "SentinelApiErrors",
          "exp_alerts": []
        }
      ]
    },
    {
      "name": "SentinelApiLatency pending, firing, recovered",
      "interval": "1m",
      "input_series": [
        {
          "series": "sentinel_http_duration_seconds_bucket{service=\"sentinel-demo-api\",le=\"0.5\"}",
          "values": "0+100x16 1600+0x20"
        },
        {
          "series": "sentinel_http_duration_seconds_bucket{service=\"sentinel-demo-api\",le=\"1\"}",
          "values": "0+190x16 3040+0x20"
        },
        {
          "series": "sentinel_http_duration_seconds_bucket{service=\"sentinel-demo-api\",le=\"+Inf\"}",
          "values": "0+200x16 3200+0x20"
        },
        {
          "series": "sentinel_http_duration_seconds_count{service=\"sentinel-demo-api\"}",
          "values": "0+200x16 3200+0x20"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "0m",
          "alertname": "SentinelApiLatency",
          "exp_alerts": []
        },
        {
          "eval_time": "16m",
          "alertname": "SentinelApiLatency",
          "exp_alerts": [
            {
              "exp_labels": {
                "service": "sentinel-demo-api",
                "severity": "warning",
                "scope": "operational"
              },
              "exp_annotations": {
                "summary": "SentinelApiLatency",
                "description": "Observed p95 response duration exceeds 500ms for ten minutes at sufficient volume."
              }
            }
          ]
        },
        {
          "eval_time": "30m",
          "alertname": "SentinelApiLatency",
          "exp_alerts": []
        }
      ]
    },
    {
      "name": "SentinelNotificationDrops pending, firing, recovered",
      "interval": "1m",
      "input_series": [
        {
          "series": "sentinel_notification_dropped_total{component=\"hub\",reason=\"backpressure\"}",
          "values": "0+10x16 160+0x20"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "0m",
          "alertname": "SentinelNotificationDrops",
          "exp_alerts": []
        },
        {
          "eval_time": "16m",
          "alertname": "SentinelNotificationDrops",
          "exp_alerts": [
            {
              "exp_labels": {
                "severity": "warning",
                "scope": "operational"
              },
              "exp_annotations": {
                "summary": "SentinelNotificationDrops",
                "description": "More than 20 optional notification hints dropped in five minutes; REST remains authoritative."
              }
            }
          ]
        },
        {
          "eval_time": "30m",
          "alertname": "SentinelNotificationDrops",
          "exp_alerts": []
        }
      ]
    },
    {
      "name": "SentinelDeadLetters pending, firing, recovered",
      "interval": "1m",
      "input_series": [
        {
          "series": "rabbitmq_detailed_queue_messages_ready{queue=\"sentinel.security.events.v1.dead\"}",
          "values": "1+0x16 0+0x20"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "0m",
          "alertname": "SentinelDeadLetters",
          "exp_alerts": []
        },
        {
          "eval_time": "16m",
          "alertname": "SentinelDeadLetters",
          "exp_alerts": [
            {
              "exp_labels": {
                "queue": "sentinel.security.events.v1.dead",
                "severity": "warning",
                "scope": "operational"
              },
              "exp_annotations": {
                "summary": "SentinelDeadLetters",
                "description": "Quarantined audit events require operator inspection and the existing replay procedure."
              }
            }
          ]
        },
        {
          "eval_time": "30m",
          "alertname": "SentinelDeadLetters",
          "exp_alerts": []
        }
      ]
    },
    {
      "name": "healthy and low-volume traffic does not alert",
      "interval": "1m",
      "input_series": [
        {
          "series": "up{job=\"sentinel-apps\",component=\"admin-api\"}",
          "values": "1+0x36"
        },
        {
          "series": "sentinel_worker_connected{service=\"sentinel-event-worker\"}",
          "values": "1+0x36"
        },
        {
          "series": "sentinel_dependency_up{service=\"sentinel-demo-api\",dependency=\"redis\"}",
          "values": "1+0x36"
        },
        {
          "series": "rabbitmq_detailed_queue_messages_ready{queue=\"sentinel.security.events.v1\"}",
          "values": "0+0x36"
        },
        {
          "series": "sentinel_worker_deliveries_total{outcome=\"error\"}",
          "values": "0+1x36"
        },
        {
          "series": "sentinel_worker_deliveries_total{outcome=\"persisted\"}",
          "values": "0+1x36"
        },
        {
          "series": "sentinel_http_requests_total{service=\"sentinel-demo-api\",status_class=\"5xx\"}",
          "values": "0+1x36"
        },
        {
          "series": "sentinel_http_requests_total{service=\"sentinel-demo-api\",status_class=\"2xx\"}",
          "values": "0+1x36"
        },
        {
          "series": "sentinel_http_duration_seconds_bucket{service=\"sentinel-demo-api\",le=\"0.5\"}",
          "values": "0+1x36"
        },
        {
          "series": "sentinel_http_duration_seconds_bucket{service=\"sentinel-demo-api\",le=\"1\"}",
          "values": "0+1x36"
        },
        {
          "series": "sentinel_http_duration_seconds_bucket{service=\"sentinel-demo-api\",le=\"+Inf\"}",
          "values": "0+1x36"
        },
        {
          "series": "sentinel_http_duration_seconds_count{service=\"sentinel-demo-api\"}",
          "values": "0+1x36"
        },
        {
          "series": "sentinel_notification_dropped_total{component=\"hub\",reason=\"backpressure\"}",
          "values": "0+1x36"
        },
        {
          "series": "rabbitmq_detailed_queue_messages_ready{queue=\"sentinel.security.events.v1.dead\"}",
          "values": "0+0x36"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "30m",
          "alertname": "SentinelAdminUnavailable",
          "exp_alerts": []
        },
        {
          "eval_time": "30m",
          "alertname": "SentinelWorkerUnavailable",
          "exp_alerts": []
        },
        {
          "eval_time": "30m",
          "alertname": "SentinelDependencyUnavailable",
          "exp_alerts": []
        },
        {
          "eval_time": "30m",
          "alertname": "SentinelEventBacklog",
          "exp_alerts": []
        },
        {
          "eval_time": "30m",
          "alertname": "SentinelWorkerFailures",
          "exp_alerts": []
        },
        {
          "eval_time": "30m",
          "alertname": "SentinelApiErrors",
          "exp_alerts": []
        },
        {
          "eval_time": "30m",
          "alertname": "SentinelApiLatency",
          "exp_alerts": []
        },
        {
          "eval_time": "30m",
          "alertname": "SentinelNotificationDrops",
          "exp_alerts": []
        },
        {
          "eval_time": "30m",
          "alertname": "SentinelDeadLetters",
          "exp_alerts": []
        }
      ]
    }
  ]
}
