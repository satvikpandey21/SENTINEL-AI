[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-demo-api"
version = "0.1.0"
description = "Isolated demonstration API monitored by SENTINEL AI"
requires-python = ">=3.11"
dependencies = ["sentinel-security==0.1.0", "uvicorn>=0.34,<1"]

[tool.setuptools.packages.find]
where = ["src"]
